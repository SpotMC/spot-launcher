<!doctype html>
<html lang="ru" class="h-full dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spot Launcher</title>
  </head>
  <body class="h-full">
    <script>
      ;(function(){
        var themes = {
          spot:    { bg:"0.16 0.006 286", primary:"0.76 0.085 264", accent:"0.85 0.055 264", hex:"#8d9ff5", hex2:"#b9c4fa" },
          orange:  { bg:"0.08 0.01 260", primary:"0.65 0.22 40",  accent:"0.75 0.18 75",  hex:"#f97316", hex2:"#fbbf24" },
          fire:    { bg:"0.11 0.02 30",  primary:"0.58 0.24 25",  accent:"0.72 0.19 55",  hex:"#F44336", hex2:"#FF9800" },
          minecraft:{ bg:"0.12 0.01 260", primary:"0.65 0.2 145",  accent:"0.72 0.18 130", hex:"#4CAF50", hex2:"#8BC34A" },
          ocean:   { bg:"0.09 0.015 250",primary:"0.62 0.18 245", accent:"0.80 0.12 240", hex:"#4A8FE7", hex2:"#80CAFF" },
          gold:    { bg:"0.12 0.02 80",  primary:"0.80 0.17 85",  accent:"0.72 0.19 55",  hex:"#FFC107", hex2:"#FF9800" },
          rose:    { bg:"0.11 0.02 340", primary:"0.55 0.27 355", accent:"0.65 0.28 350", hex:"#E91E63", hex2:"#FF4081" },
          arctic:  { bg:"0.09 0.01 240", primary:"0.58 0.04 230", accent:"0.78 0.02 230", hex:"#78909C", hex2:"#B0BEC5" }
        }
        var id = localStorage.getItem("theme") || "spot"
        var t = themes[id] || themes.spot
        var r = document.documentElement.style
        r.setProperty("--background", "oklch(" + t.bg + ")")
        r.setProperty("--primary",    "oklch(" + t.primary + ")")
        r.setProperty("--accent",     "oklch(" + t.accent + ")")
        r.setProperty("--border",     "oklch(0.17 0.01 260)")
        r.setProperty("--splash-hex", t.hex)
        r.setProperty("--splash-hex2",t.hex2)
      })()
    </script>
    <div id="splash">
      <style>
        html,body{margin:0;background:#0c0d10}
        #splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0c0d10;color:#fff;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-app-region:drag;user-select:none}
        #splash:before{content:'';position:absolute;inset:0;pointer-events:none;background:
          radial-gradient(220px 140px at 50% 0%, color-mix(in srgb, var(--splash-hex,#8d9ff5) 42%, transparent), transparent 72%),
          radial-gradient(180px 120px at 50% 100%, color-mix(in srgb, var(--splash-hex2,#b9c4fa) 28%, transparent), transparent 70%)}
        #splash:after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.07);border-radius:18px}
        #splash .stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 32px 32px}
        #splash .logo-container{position:relative;width:108px;height:108px;display:flex;align-items:center;justify-content:center;animation:logoFloat 3.2s ease-in-out infinite}
        #splash .logo-ring{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 62%,var(--splash-hex,#8d9ff5) 78%,transparent 92%);opacity:.85;animation:ringSpin 2.8s linear infinite;-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%)}
        #splash .logo-glow{position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,var(--splash-hex,#8d9ff5) 0%,transparent 68%);opacity:.22;filter:blur(12px);animation:glowPulse 3.2s ease-in-out infinite}
        #splash .logo{width:78px;height:78px;object-fit:contain;filter:drop-shadow(0 10px 22px rgba(90,111,242,.45));animation:logoScale 3.6s ease-in-out infinite}
        #splash .title{margin-top:18px;font-size:22px;font-weight:700;letter-spacing:-.02em;color:#f4f6ff;font-family:'Unbounded','Inter',sans-serif}
        #splash .subtitle{margin-top:6px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.38);font-weight:600}
        #splash .progress-container{margin-top:26px;width:220px}
        #splash .progress-bar{position:relative;height:3px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
        #splash .progress-fill{position:absolute;top:0;bottom:0;left:0;width:36%;border-radius:inherit;background:linear-gradient(90deg,transparent,var(--splash-hex,#8d9ff5),#fff,var(--splash-hex2,#b9c4fa));animation:indet 1.15s ease-in-out infinite}
        #splash .progress-fill.determinate{animation:none;background:linear-gradient(90deg,var(--splash-hex,#5a6ff2),var(--splash-hex2,#b9c4fa));box-shadow:0 0 14px color-mix(in srgb,var(--splash-hex,#8d9ff5) 60%,transparent);transition:width .35s cubic-bezier(.25,.1,.25,1)}
        #splash .status{margin-top:14px;min-height:16px;font-size:12px;letter-spacing:.01em;color:rgba(255,255,255,.55);font-weight:500}
        #splash .loading-dots{display:inline-flex;gap:3px;margin-left:7px;vertical-align:middle}
        #splash .loading-dots span{width:3px;height:3px;border-radius:50%;background:var(--splash-hex,#8d9ff5);animation:dotBounce 1.2s ease-in-out infinite}
        #splash .loading-dots span:nth-child(2){animation-delay:.15s}
        #splash .loading-dots span:nth-child(3){animation-delay:.3s}
        @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
        @keyframes ringSpin{to{transform:rotate(360deg)}}
        @keyframes glowPulse{0%,100%{opacity:.16}50%{opacity:.32}}
        @keyframes logoScale{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
        @keyframes indet{0%{transform:translateX(-140%)}100%{transform:translateX(340%)}}
        @keyframes dotBounce{0%,70%,100%{opacity:.35}35%{opacity:1}}
        #splash.fade{opacity:0;transition:opacity .32s ease}
      </style>
      <div class="stage">
        <div class="logo-container">
          <div class="logo-glow"></div>
          <div class="logo-ring"></div>
          <img class="logo" src="./spot-logo-mono-2.png" alt="Spot" draggable="false" />
        </div>
        <div class="title">Spot Launcher</div>
        <div class="subtitle" id="splash-subtitle">Инициализация</div>
        <div class="progress-container">
          <div class="progress-bar">
            <div class="progress-fill" id="splash-bar"></div>
          </div>
        </div>
        <div class="status" id="splash-status">Загрузка<span class="loading-dots"><span></span><span></span><span></span></span></div>
      </div>
    </div>
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
